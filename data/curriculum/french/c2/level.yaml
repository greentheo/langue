title: Mastery
summary: >
  Near-native command: understand virtually everything, and express fine
  shades of meaning precisely and with style. This is the level of the DALF
  C2 exam.

can_do:
  - understand virtually everything you hear or read, with ease
  - summarise information from several sources, reconstructing the arguments coherently
  - express yourself spontaneously, very fluently and precisely
  - distinguish finer shades of meaning, even in complex situations
  - write complex texts with a clear logical structure and a personal style

grammar:
  - topic: "Literary tenses: imparfait and plus-que-parfait du subjonctif (recognition)"
  - topic: "Style, rhythm and rhetorical devices"
  - topic: "Irony, wordplay and implicit meaning"
  - topic: "Proverbs, idioms and cultural references"
  - topic: "Regional and historical varieties of French"
  - topic: "Specialised registers: legal, academic, journalistic"

themes:
  - literature
  - specialised fields
  - French-speaking cultures
  - history and society
