title: Advanced
summary: >
  Flexible and precise: understand demanding texts and what they imply, and
  adapt your French to any social, academic or professional setting. This is
  the level of the DALF C1 exam.

can_do:
  - understand long, demanding texts and recognise implicit meaning
  - express yourself fluently and spontaneously without searching for words
  - use French flexibly for social, academic and professional purposes
  - switch between familiar, everyday and formal registers
  - write clear, well-structured, detailed text on complex subjects
  - follow extended speech even when it is not clearly structured

grammar:
  - topic: "Subtle mood choice: subjunctive after superlatives and in relative clauses (le seul qui sache)"
  - topic: "The expletive ne: avant qu'il ne parte, je crains qu'il ne vienne"
  - topic: "Inversion in formal writing and after peut-être, sans doute, aussi"
  - topic: "Literary tenses: passé simple and passé antérieur (recognition)"
  - topic: "Nuanced connectors and discourse markers"
  - topic: "Registers: familier, courant, soutenu"
  - topic: "Idiomatic expressions and fixed phrases"
  - topic: "Impersonal constructions: il s'agit de, il importe que"

themes:
  - academic and professional life
  - culture and literature
  - nuance and humour
  - ethics and ideas
