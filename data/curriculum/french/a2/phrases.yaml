        literally: I make of-the 40
      - target: ["Où sont les cabines d'essayage ?"]
        english: ["Where are the fitting rooms?", "Where are the changing rooms?", "Where's the fitting room?"]
        literally: where are the cabins of trying-on?
      - target: ["C'est un peu trop serré.", "Il est un peu trop serré.", "Elle est un peu trop serrée."]
        english: ["It's a bit too tight.", "It's a little too tight."]
        note: "The opposite is *trop large* — too loose."
