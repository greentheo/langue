    phrases:
      - target: ["Vous l'avez en 38 ?", "Vous l'avez en trente-huit ?", "Est-ce que vous l'avez en 38 ?", "Vous l'avez en taille 38 ?", "Vous avez ça en 38 ?"]
        english: ["Do you have it in a 38?", "Do you have it in size 38?", "Do you have this in a 38?", "Have you got it in a 38?"]
        note: "French sizes: a women's 38 is about a UK 10 or a US 6."
