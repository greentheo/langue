situations:
  - id: stories
    title: What happened? Telling and reacting
    phrases:
      - target: ["Tu as passé un bon week-end ?", "Est-ce que tu as passé un bon week-end ?", "Vous avez passé un bon week-end ?", "Est-ce que vous avez passé un bon week-end ?"]
        english: ["Did you have a good weekend?", "Did you have a nice weekend?", "Have you had a good weekend?"]
        note: "*Passer* means to spend (time). To an adult: *Vous avez passé un bon week-end ?*"
        literally: you have spent a good weekend?
      - target: ["Qu'est-ce que tu as fait ce week-end ?", "Tu as fait quoi ce week-end ?", "Qu'est-ce que vous avez fait ce week-end ?"]
        english: ["What did you do this weekend?", "What did you do at the weekend?", "What did you do on the weekend?", "What did you get up to this weekend?"]
        note: "*Tu as fait quoi ?* is the relaxed, spoken way to ask."
        literally: what is it that you have done this weekend?
      - target: ["C'était génial ! On est allés à la plage.", "C'était génial ! Nous sommes allés à la plage.", "C'était super ! On est allés à la plage."]
        english: ["It was great! We went to the beach.", "It was brilliant! We went to the beach.", "Great! We went to the beach."]
        note: "*On* means \"we\" here. After *on est*, the past participle usually takes an -s: *on est allés*."
        literally: it was great! one is gone to the beach
      - target: ["C'était comment ?", "Comment c'était ?"]
        english: ["How was it?", "What was it like?"]
        note: Ask it about anything that's over — a film, a party, a trip.
        literally: it was how?
      - target: ["Raconte !", "Racontez !"]
        display: "Raconte ! / Racontez !"
        english: ["Tell me all about it!", "Tell me!", "Tell me everything!", "Do tell!"]
        note: "*Raconte* is for a friend; *Racontez* is polite, or for more than one person."
        literally: tell!
      - target: ["Qu'est-ce qui s'est passé ?", "Qu'est-ce qui est arrivé ?"]
        english: ["What happened?", "What's happened?"]
        note: "In the present, *Qu'est-ce qui se passe ?* means \"What's going on?\""
        literally: what is it that itself is passed?
      - target: ["Ce n'est pas vrai !", "C'est pas vrai !", "Pas vrai !"]
        english: ["No way!", "You're kidding!", "You're joking!", "It's not true!", "That's not true!"]
        note: "For surprising news, good or bad. In speech the *ne* usually disappears: *C'est pas vrai !*"
        literally: it is not true
      - target: ["Quelle chance !"]
        english: ["Lucky you!", "How lucky!", "What luck!", "That's lucky!"]
        literally: what luck
      - target: ["Félicitations !", "Bravo !"]
        english: ["Congratulations!", "Well done!"]
        note: "*Bravo !* is for something someone did well, like a good mark."
        literally: congratulations
      - target: ["C'est dommage !", "Oh, c'est dommage !", "Dommage !", "Quel dommage !"]
        english: ["What a shame!", "That's a shame!", "What a pity!", "That's a pity!", "That's too bad!", "Too bad!"]
        note: For bad news that isn't too serious.
        literally: it is damage

  - id: travel
    title: Trains, delays and luggage
    phrases:
      - target: ["Un aller-retour pour Lyon, s'il vous plaît."]
        english: ["A return ticket to Lyon, please.", "A return to Lyon, please.", "A round-trip ticket to Lyon, please.", "A round trip to Lyon, please."]
        note: "A one-way ticket is *un aller simple*."
        literally: a go-return for Lyon, if it you pleases
      - target: ["Le train part de quel quai ?", "De quel quai part le train ?"]
        english: ["Which platform does the train leave from?", "What platform does the train leave from?", "Which platform is the train?"]
        note: "On the departure boards, the platform is often called *la voie* (the track)."
        literally: the train leaves from which platform?
      - target: ["Le train a vingt minutes de retard."]
        english: ["The train is twenty minutes late.", "The train is delayed by twenty minutes.", "The train's twenty minutes late."]
        note: "French says the train *has* delay. Without a number: *Le train est en retard.*"
        literally: the train has twenty minutes of delay
      - target: ["Le train est annulé."]
        english: ["The train is cancelled.", "The train has been cancelled.", "The train is canceled.", "The train has been canceled."]
        literally: the train is cancelled
      - target: ["Je dois changer de train ?", "Est-ce que je dois changer de train ?", "Il faut changer de train ?", "Est-ce qu'il faut changer de train ?"]
        english: ["Do I have to change trains?", "Do I need to change trains?", "Do I have to change?"]
        note: "*Changer de* + a noun with no article: *changer de train, changer de place*."
        literally: I must change of train?
      - target: ["J'ai raté mon train."]
        english: ["I missed my train.", "I've missed my train."]
        note: "*Rater* is the everyday verb for missing a train, a bus or a chance."
        literally: I have missed my train
      - target: ["Ma valise n'est pas arrivée."]
        english: ["My suitcase hasn't arrived.", "My suitcase didn't arrive."]
        note: "*Arriver* takes *être*, so *arrivée* agrees with *la valise*."
        literally: my suitcase is not arrived
      - target: ["Cette place est libre ?", "Est-ce que cette place est libre ?"]
        english: ["Is this seat free?", "Is this seat available?", "Is anyone sitting here?"]
        note: "*Une place* is a seat on a train or a bus, or in a cinema."
        literally: this place is free?
      - target: ["Je suis monté dans le mauvais train.", "Je suis montée dans le mauvais train."]
        display: "Je suis monté / montée dans le mauvais train."
        english: ["I got on the wrong train.", "I've got on the wrong train.", "I took the wrong train."]
        note: "*Monter* is to get on a train or a bus. Add -e if you're a girl or woman."
        literally: I am gone-up into the bad train
      - target: ["Je suis bien arrivé.", "Je suis bien arrivée."]
        display: "Je suis bien arrivé / arrivée."
        english: ["I got here safely.", "I've arrived safely.", "I arrived safely.", "I got here OK.", "I got there safely."]
        note: "The message to send home after a journey. For two or more of you: *Nous sommes bien arrivés.*"
        literally: I am well arrived

  - id: health
    title: At the doctor's and the pharmacy
    phrases:
      - target: ["J'ai mal à la gorge depuis lundi."]
        english: ["I've had a sore throat since Monday.", "My throat has been hurting since Monday."]
        note: "*Depuis* + the present: it started on Monday and it still hurts."
        literally: I have pain at the throat since Monday
      - target: ["J'ai de la fièvre."]
        english: ["I have a temperature.", "I've got a temperature.", "I have a fever.", "I've got a fever."]
        literally: I have some fever
      - target: ["Je tousse beaucoup."]
        english: ["I'm coughing a lot.", "I cough a lot.", "I've been coughing a lot."]
        literally: I cough a lot
      - target: ["J'ai un rhume.", "Je suis enrhumé.", "Je suis enrhumée."]
        english: ["I have a cold.", "I've got a cold."]
        note: "*Je suis enrhumé(e)* says the same thing."
        literally: I have a cold
      - target: ["Je me suis fait mal au genou."]
        english: ["I've hurt my knee.", "I hurt my knee."]
        note: "Change the body part: *au dos* (back), *à la cheville* (ankle), *à l'épaule* (shoulder)."
        literally: I myself am made pain at-the knee
      - target: ["Je voudrais prendre rendez-vous.", "J'aimerais prendre rendez-vous."]
        english: ["I'd like to make an appointment.", "I would like to make an appointment.", "I'd like to book an appointment."]
        note: "With a name: *prendre rendez-vous avec le docteur Martin*."
        literally: I would want to take appointment
      - target: ["C'est grave ?", "Est-ce que c'est grave ?", "C'est grave, docteur ?"]
        english: ["Is it serious?", "Is it bad?"]
        note: "The answer you hope for: *Ce n'est pas grave.* People also say it to mean \"never mind\"."
        literally: it is serious?
      - target: ["Vous avez quelque chose contre la toux ?", "Est-ce que vous avez quelque chose contre la toux ?", "Avez-vous quelque chose contre la toux ?", "Vous avez quelque chose pour la toux ?"]
        english: ["Do you have something for a cough?", "Do you have anything for a cough?", "Have you got anything for a cough?"]
        note: "At the pharmacy. For a sore throat: *quelque chose contre le mal de gorge*."
        literally: you have something against the cough?
      - target: ["Il faut une ordonnance ?", "Est-ce qu'il faut une ordonnance ?", "J'ai besoin d'une ordonnance ?", "Est-ce que j'ai besoin d'une ordonnance ?"]
        english: ["Do I need a prescription?", "Do you need a prescription?", "Is a prescription needed?"]
        literally: it is-needed a prescription?
      - target: ["Je vais mieux.", "Ça va mieux."]
        english: ["I'm feeling better.", "I feel better.", "I'm better.", "I'm getting better."]
        note: "*Mieux* is \"better\" with a verb — here, *aller*."
        literally: I go better

  - id: plans
    title: Making and changing plans
    phrases:
      - target: ["Ça te dit d'aller au cinéma ?", "Ça vous dit d'aller au cinéma ?"]
        english: ["Do you fancy going to the cinema?", "Would you like to go to the cinema?", "How about going to the cinema?", "Do you want to go to the movies?"]
        note: "A friendly way to invite someone. Change the end: *Ça te dit, une pizza ?*"
        literally: that to-you says to go to-the cinema?
      - target: ["Avec plaisir !"]
        english: ["I'd love to!", "With pleasure!", "Gladly!", "I'd be glad to!"]
        note: A warm way to say yes to an invitation.
        literally: with pleasure
      - target: ["Désolé, je ne peux pas.", "Désolée, je ne peux pas.", "Désolé, je peux pas.", "Désolée, je peux pas."]
        display: "Désolé / Désolée, je ne peux pas."
        english: ["Sorry, I can't.", "I'm sorry, I can't."]
        note: "Add -e if you're a girl or woman. Give a reason if you can: *je dois travailler*."
        literally: sorry, I not can not
      - target: ["Une autre fois, peut-être.", "Peut-être une autre fois."]
        english: ["Maybe another time.", "Another time, maybe.", "Some other time, perhaps.", "Perhaps another time."]
        literally: another time, maybe
      - target: ["On se retrouve où ?", "Où est-ce qu'on se retrouve ?"]
        english: ["Where shall we meet?", "Where are we meeting?", "Where should we meet?", "Where do we meet?"]
        note: "*Se retrouver* is to meet up, by arrangement. The answer: *On se retrouve à la gare.*"
        literally: one oneself finds-again where?
      - target: ["Ça marche !"]
        english: ["Sounds good!", "Deal!", "That works!", "OK!", "Okay!"]
        note: "Casual. *Marcher* (to walk) also means \"to work\"."
        literally: that walks
      - target: ["Je serai là à huit heures.", "Je serai là à 8 heures."]
        english: ["I'll be there at eight.", "I'll be there at eight o'clock."]
        note: "*Serai* is the future of *être*."
        literally: I will-be there at eight hours
      - target: ["J'ai un empêchement."]
        english: ["Something's come up.", "Something has come up.", "I can't make it."]
        note: A polite way to cancel without saying why.
        literally: I have a hindrance
      - target: ["On remet ça à samedi ?", "On peut remettre ça à samedi ?"]
        english: ["Shall we move it to Saturday?", "Can we move it to Saturday?", "Can we put it off till Saturday?", "Shall we put it off until Saturday?"]
        note: "*Remettre* here means to put off, to postpone."
        literally: one puts-back that to Saturday?
      - target: ["Je te tiens au courant.", "Je vous tiens au courant."]
        english: ["I'll keep you posted.", "I'll let you know.", "I'll keep you updated."]
        note: "To an adult, or to more than one person: *Je vous tiens au courant.*"
        literally: I you hold in-the current

  - id: restaurant
    title: Eating out
    phrases:
      - target: ["Je voudrais réserver une table pour quatre personnes.", "J'aimerais réserver une table pour quatre personnes.", "Je voudrais réserver une table pour quatre.", "J'aimerais réserver une table pour quatre."]
        english: ["I'd like to book a table for four.", "I would like to book a table for four.", "I'd like to book a table for four people.", "I'd like to reserve a table for four."]
        note: "Add the day and time: *pour samedi soir, à vingt heures*."
        literally: I would want to reserve a table for four people
      - target: ["Nous n'avons pas encore choisi.", "On n'a pas encore choisi."]
        english: ["We haven't decided yet.", "We haven't chosen yet.", "We're not ready yet."]
        note: "The answer to the waiter's *Vous avez choisi ?*"
        literally: we not have not yet chosen
      - target: ["Je vais prendre le plat du jour.", "Je prends le plat du jour.", "Le plat du jour, s'il vous plaît."]
        english: ["I'll have the dish of the day.", "I'll have today's special.", "I'll have the special.", "I'll take the dish of the day."]
        note: "*Le plat du jour* is usually the cheapest hot meal on the menu, and often the best."
        literally: I go take the dish of-the day
      - target: ["Qu'est-ce que vous avez comme desserts ?"]
        english: ["What do you have for dessert?", "What desserts do you have?", "What have you got for dessert?"]
        note: "Works for anything: *Qu'est-ce que vous avez comme glaces ?*"
        literally: what is it that you have as desserts?
      - target: ["Une carafe d'eau, s'il vous plaît."]
        english: ["A jug of water, please.", "A carafe of water, please.", "A jug of tap water, please.", "Some tap water, please."]
        note: "Tap water in a jug is free in French restaurants. *Une bouteille d'eau* is bottled, and you pay for it."
        literally: a carafe of water, if it you pleases
      - target: ["Encore un peu de pain, s'il vous plaît."]
        english: ["A bit more bread, please.", "Some more bread, please.", "A little more bread, please.", "More bread, please."]
        literally: again a little of bread, if it you pleases
      - target: ["Je suis allergique aux noix."]
        english: ["I'm allergic to nuts.", "I am allergic to nuts."]
        note: "*À* + *les* becomes *aux*. For one thing: *allergique au lait* (to milk)."
        literally: I am allergic to-the nuts
      - target: ["Excusez-moi, ce n'est pas ce que j'ai commandé.", "Pardon, ce n'est pas ce que j'ai commandé."]
        english: ["Excuse me, this isn't what I ordered.", "Excuse me, that's not what I ordered.", "Excuse me, this is not what I ordered."]
        note: "Complaining politely: start with *Excusez-moi*, and keep your voice calm."
        literally: excuse me, it is not that which I have ordered
      - target: ["Je n'ai plus faim."]
        english: ["I'm not hungry any more.", "I'm not hungry anymore.", "I'm full."]
        note: "Don't say *je suis plein* — that's for a full bottle, not a person."
        literally: I not have more hunger
      - target: ["On peut payer séparément ?", "Est-ce qu'on peut payer séparément ?", "Nous pouvons payer séparément ?", "Est-ce que nous pouvons payer séparément ?"]
        english: ["Can we pay separately?", "Could we pay separately?"]
        literally: one can pay separately?

  - id: phone
