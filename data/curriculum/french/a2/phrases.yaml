      - target: ["Je pourrais changer de chambre ?", "Est-ce que je pourrais changer de chambre ?", "Pourrais-je changer de chambre ?"]
        english: ["Could I change rooms?", "Could I move to another room?", "Could I switch rooms?", "Could I have a different room?"]
