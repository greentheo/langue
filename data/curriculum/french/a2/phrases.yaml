      - target: ["Je peux laisser un message ?", "Est-ce que je peux laisser un message ?", "Puis-je laisser un message ?"]
        english: ["Can I leave a message?", "May I leave a message?", "Could I leave a message?"]
        literally: I can leave a message?
      - target: ["Ne quittez pas."]
        english: ["Hold on.", "Hold the line.", "Please hold.", "Hold on, please."]
        note: What you hear while someone goes to fetch the person you want.
        literally: don't leave
      - target: ["Je te rappelle plus tard.", "Je vous rappelle plus tard."]
        english: ["I'll call you back later.", "I'll ring you back later.", "I'll phone you back later."]
        note: "To an adult: *Je vous rappelle plus tard.*"
        literally: I you re-call later
      - target: ["Je ne t'entends pas bien.", "Je ne vous entends pas bien.", "Je t'entends mal.", "Je vous entends mal."]
        english: ["I can't hear you very well.", "I can't hear you well.", "I can hardly hear you."]
        literally: I not you hear not well
      - target: ["Je n'ai plus de batterie."]
        english: ["My battery's dead.", "I've got no battery left.", "I have no battery left.", "My phone's dead."]
        literally: I not have more of battery
      - target: ["Vous vous êtes trompé de numéro.", "Vous vous êtes trompée de numéro.", "Tu t'es trompé de numéro.", "Tu t'es trompée de numéro."]
        english: ["You've got the wrong number.", "You have the wrong number.", "Wrong number."]
        note: "*Se tromper de* is to get the wrong one: *je me suis trompé de bus*."
