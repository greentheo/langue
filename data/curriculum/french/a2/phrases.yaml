      - target: ["Je t'envoie un texto.", "Je t'envoie un message.", "Je vous envoie un message."]
        english: ["I'll text you.", "I'll send you a text.", "I'll send you a message.", "I'm sending you a text."]
        literally: I you send a text

  - id: clothes
