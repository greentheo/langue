title: Elementary
summary: >
  Everyday independence: talk about what you did and what you will do,
  handle routine errands on your own, and write short personal messages.
  This is the level of the DELF A2 exam.

can_do:
  - say what you did last weekend or on holiday, and describe what it was like
  - talk about your childhood and what you used to do
  - make plans and arrangements with friends
  - handle routine errands — transport, hotels, shops, a doctor or pharmacy
  - describe people, places, your background and your surroundings
  - compare things and say which you prefer
  - give and follow simple directions and instructions
  - write short notes, messages and simple personal letters
  - understand the main point of short, clear announcements and messages

grammar:
  - topic: "Passé composé with avoir"
    lessons: [01-passe-compose-avoir]
  - topic: "Irregular past participles: fait, pris, vu, eu, été, dit, mis"
    lessons: [02-irregular-participles]
  - topic: "Passé composé with être, and agreement of the past participle"
    lessons: [03-passe-compose-etre]
  - topic: "Reflexive verbs in the passé composé"
    lessons: [04-reflexive-past]
  - topic: "Imparfait for descriptions and habits, and choosing it over the passé composé"
    lessons: [05-imparfait, 06-imparfait-or-passe-compose]
  - topic: "Venir de + infinitive (just did) and être en train de (in the middle of)"
    lessons: [07-time-expressions]
  - topic: "Time expressions: depuis, il y a, pendant"
    lessons: [07-time-expressions]
  - topic: "Futur simple"
    lessons: [08-futur-simple]
  - topic: "Quantities: beaucoup de, un peu de, assez de, trop de"
    lessons: [09-quantities-negatives]
  - topic: "Other negatives: ne… plus, ne… rien, ne… personne"
    lessons: [09-quantities-negatives]
  - topic: "Direct and indirect object pronouns: le, la, les, lui, leur"
    lessons: [10-object-pronouns]
  - topic: "The pronouns y and en"
    lessons: [11-y-and-en]
  - topic: "Comparatives and superlatives: plus… que, le plus, meilleur, mieux"
    lessons: [12-comparisons]
  - topic: "Relative pronouns qui and que (and où)"
    lessons: [13-qui-que]
  - topic: "The imperative, including negatives"
    lessons: [14-imperative]
  - topic: "Il faut + infinitive"
    lessons: [14-imperative]
  - topic: "The polite conditional: j'aimerais, pourriez-vous"
    lessons: [15-conditional]

themes:
  - holidays and travel
  - transport
  - shopping and clothes
  - health and the body
  - weather and seasons
  - house and home
  - school and work
  - childhood memories
  - food and recipes

# The ten sub-levels, A2.1 to A2.10, in teaching order. Lessons stay in
# number order, because each lesson's practice may use earlier lessons.
# The heavier lessons (07, 09, 14) and the conditional each get a unit of
# their own, with two vocabulary categories; the paired-lesson units get one.
units:
  - title: What did you do?
    lessons: [01-passe-compose-avoir, 02-irregular-participles]
    situations: [stories]
    categories: [emotions]
  - title: Comings and goings
    lessons: [03-passe-compose-etre, 04-reflexive-past]
    situations: [travel]
    categories: [transportation]
  - title: When I was little
    lessons: [05-imparfait, 06-imparfait-or-passe-compose]
    categories: [nature, weather]
  - title: Since when?
    lessons: [07-time-expressions]
    situations: [health]
    categories: [health, time]
  - title: Making plans
    lessons: [08-futur-simple]
    situations: [plans]
    categories: [leisure, verbs]
  - title: A little, a lot
    lessons: [09-quantities-negatives]
    situations: [restaurant]
    categories: [food, shopping]
  - title: On the phone
    lessons: [10-object-pronouns, 11-y-and-en]
    situations: [phone]
    categories: [technology]
  - title: Bigger, better, cheaper
    lessons: [12-comparisons, 13-qui-que]
    situations: [clothes]
    categories: [clothing]
  - title: Home and school
    lessons: [14-imperative]
    situations: [home]
    categories: [housing, education]
  - title: Could you…?
    lessons: [15-conditional]
    situations: [hotel]
    categories: [travel, work]
