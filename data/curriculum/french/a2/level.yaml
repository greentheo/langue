title: Elementary
summary: >
  Everyday independence: talk about what you did and what you will do,
  handle routine errands on your own, and write short personal messages.
  This is the level of the DELF A2 exam.

can_do:
  - say what you did last weekend or on holiday, and describe what it was like
  - talk about your childhood and what you used to do
  - make plans and arrangements with friends
  - handle routine errands — transport, hotels, shops, a doctor or pharmacy
  - describe people, places, your background and your surroundings
  - compare things and say which you prefer
  - give and follow simple directions and instructions
  - write short notes, messages and simple personal letters
  - understand the main point of short, clear announcements and messages

grammar:
  - topic: "Passé composé with avoir"
  - topic: "Passé composé with être, and agreement of the past participle"
  - topic: "Irregular past participles: fait, pris, vu, eu, été, dit, mis"
  - topic: "Imparfait for descriptions and habits, and choosing it over the passé composé"
  - topic: "Reflexive verbs in the passé composé"
  - topic: "Futur simple"
  - topic: "Venir de + infinitive (just did) and être en train de (in the middle of)"
  - topic: "Direct and indirect object pronouns: le, la, les, lui, leur"
  - topic: "The pronouns y and en"
  - topic: "Comparatives and superlatives: plus… que, le plus, meilleur, mieux"
  - topic: "The imperative, including negatives"
  - topic: "Quantities: beaucoup de, un peu de, assez de, trop de"
  - topic: "Other negatives: ne… plus, ne… rien, ne… personne"
  - topic: "Relative pronouns qui and que"
  - topic: "Il faut + infinitive"
  - topic: "Time expressions: depuis, il y a, pendant"
  - topic: "The polite conditional: j'aimerais, pourriez-vous"

themes:
  - holidays and travel
  - transport
  - shopping and clothes
  - health and the body
  - weather and seasons
  - house and home
  - school and work
  - childhood memories
  - food and recipes
