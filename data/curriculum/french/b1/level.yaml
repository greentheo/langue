title: Intermediate
summary: >
  The threshold of real independence: cope with most situations while
  travelling, tell stories, and explain and justify your opinions. This is
  the level of the DELF B1 exam.

can_do:
  - deal with most situations while travelling, including problems and complaints
  - describe experiences, events, dreams, hopes and ambitions
  - give reasons and explanations for your opinions and plans
  - tell a story, or the plot of a film or book
  - follow the main points of clear TV and radio on familiar topics
  - join a conversation on a familiar topic without preparing
  - write connected text about your experiences and impressions

grammar:
  - topic: "Conditionnel présent for wishes, advice and hypotheses"
  - topic: "Si + présent → futur, and si + imparfait → conditionnel"
  - topic: "Plus-que-parfait"
  - topic: "Subjonctif présent after il faut que, vouloir que and expressions of feeling"
  - topic: "Futur antérieur (recognition)"
  - topic: "Relative pronouns dont and où"
  - topic: "Demonstrative pronouns (celui, celle) and possessive pronouns (le mien, la tienne)"
  - topic: "Double object pronouns: je le lui donne"
  - topic: "Reported speech in the present: il dit que…"
  - topic: "The gérondif: en + -ant"
  - topic: "Introduction to the passive voice"
  - topic: "Connectors: cependant, donc, alors que, puisque, pourtant"
  - topic: "Passé simple (recognition in stories)"

themes:
  - work and careers
  - education
  - media and news
  - the environment
  - relationships and feelings
  - culture and leisure
  - travel problems
  - health and lifestyle
