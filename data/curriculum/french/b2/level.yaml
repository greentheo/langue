title: Upper intermediate
summary: >
  Confident and fluent: understand complex texts, discuss abstract topics,
  and argue a point of view with nuance. This is the level of the DELF B2
  exam.

can_do:
  - understand the main ideas of complex texts, including technical discussion in your field
  - follow the news, films and most TV in standard French
  - talk with native speakers fluently and spontaneously, without strain on either side
  - explain your view on a topical issue, giving the advantages and disadvantages
  - write clear, detailed essays, reports and formal letters
  - summarise and comment on articles and interviews

grammar:
  - topic: "Subjonctif with all common triggers, and the past subjunctive"
  - topic: "Conjunctions that take the subjunctive: bien que, pour que, à condition que, avant que"
  - topic: "Sequence of tenses (concordance des temps)"
  - topic: "Si + plus-que-parfait → conditionnel passé"
  - topic: "The passive voice in all tenses"
  - topic: "Reported speech in the past, with tense changes"
  - topic: "Participe présent versus gérondif"
  - topic: "Emphasis with c'est… qui and c'est… que"
  - topic: "Relative pronouns lequel, auquel, duquel"
  - topic: "Passé simple in written narrative"
  - topic: "Nominalisation: décider → la décision"
  - topic: "Connectors for argument: en revanche, par conséquent, néanmoins"

themes:
  - society and current affairs
  - politics
  - the economy and work
  - science and technology
  - the arts
  - debate and argument
