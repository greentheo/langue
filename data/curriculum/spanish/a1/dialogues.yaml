  # ── Unit 1: ¡Hola! ──────────────────────────────────────────────────────
  - id: new-school
    unit: 1
    title: First day at school
    setting: It's your first day at a new school in Mexico. A girl in your class says hello.
    with: Lucía
    lines:
      - them: ¡Hola! Me llamo Lucía. ¿Cómo te llamas?
        english: Hi! My name's Lucía. What's your name?
      - you: Say hi and tell her your name.
        answers:
          - ¡Hola! Me llamo Sam.
          - Hola, me llamo *.
          - Me llamo *.
          - Hola, soy *.
      - them: Mucho gusto. ¿Cómo estás?
        english: Nice to meet you. How are you?
      - you: Say you're fine, thanks, and ask how she is.
        answers:
          - Bien, gracias. ¿Y tú?
          - Muy bien, gracias. ¿Y tú?
          - Bien, gracias. ¿Cómo estás?
          - Muy bien, gracias. ¿Cómo estás tú?
      - them: Muy bien. ¡Uy, viene la profesora! Hasta luego.
        english: Very well. Oops, the teacher's coming! See you later.
      - you: Say see you later.
        answers:
          - Hasta luego.
          - Adiós, hasta luego.
          - Adiós.

