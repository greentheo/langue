          - Hola, buenas tardes. ¿Cómo está usted?
      - them: Muy bien, gracias. ¿Y usted?
        english: Very well, thank you. And you?
      - you: Say you're fine, thank you.
        answers:
          - Bien, gracias.
          - Muy bien, gracias.
          - Bien, muchas gracias.
          - Muy bien, muchas gracias.
      - them: Me llamo Carmen. ¿Cómo se llama usted?
        english: My name is Carmen. What's your name?
      - you: Tell her your name, and say nice to meet you.
        answers:
          - Me llamo Alex. Mucho gusto.
          - Me llamo *. Mucho gusto.
          - Me llamo *. Encantado.
          - Me llamo *. Encantada.
          - Mucho gusto. Me llamo *.
      - them: Mucho gusto. Bueno, ¡hasta luego!
        english: Nice to meet you. Well, see you later!
      - you: Say goodbye.
        answers:
          - Adiós.
          - Adiós, señora.
          - Hasta luego.
          - Adiós, hasta luego.

  # ── Unit 2: How Spanish sounds ──────────────────────────────────────────
  - id: dog-in-the-park
    unit: 2
    title: A dog in the park
    setting: In a park in Bogotá, a girl with a dog says something to you, very fast.
    with: a girl in the park
    lines:
      - them: ¡Hola! ¿Te gustan los perros?
        english: Hi! Do you like dogs?
      - you: Say sorry, you don't understand.
        answers:
          - Lo siento, no entiendo.
          - Perdón, no entiendo.
          - No entiendo.
      - them: ¿Te gustan los perros?
        english: Do you like dogs?
      - you: Ask her to say it more slowly, please.
        answers:
          - Más despacio, por favor.
          - ¿Puedes hablar más despacio, por favor?
          - ¿Puede hablar más despacio, por favor?
          - Más despacio.
      - them: ¿Te… gustan… los… perros?
        english: Do… you… like… dogs?
      - you: 'Ask what "perros" means.'
        answers:
          - ¿Qué significa «perros»?
          - ¿Qué quiere decir «perros»?
      - them: '«Perros» es "dogs" en inglés. ¡Mira, mi perro!'
        english: '"Perros" is "dogs" in English. Look, my dog!'
      - you: Say yes, and thank her.
        answers:
          - ¡Sí! Gracias.
          - Sí, muchas gracias.
          - Sí, me gustan. Gracias.
      - them: ¡De nada! ¡Adiós!
        english: You're welcome! Bye!
      - you: Say see you later.
        answers:
          - Hasta luego.
          - Adiós, hasta luego.
          - Adiós.

