title: Grande y bonito
subtitle: Adjectives, agreement and *este*
goal: describe people and things with adjectives that match the noun, and point things out with *este, esta, estos, estas*
minutes: 12

sections:
  - heading: Adjectives match the noun
    body: |
      An *adjective* is a describing word, like "tall" or "new". In Spanish,
      it changes to match its noun: masculine or feminine, singular or
      plural.

      Adjectives ending in **-o** have four forms: *alto, alta, altos,
      altas*.
    table:
      columns: ["", singular, plural]
      rows:
        - [masculine, el chico alto, los chicos altos]
        - [feminine, la chica alta, las chicas altas]
    examples:
      - ["un perro pequeño", "a small dog"]
      - ["una casa pequeña", "a small house"]
      - ["Los libros son nuevos.", "The books are new."]

  - heading: Adjectives ending in -e or a consonant
    body: |
      These only change for plural, not for masculine and feminine:

      - *grande → grandes* (big)
      - *inteligente → inteligentes* (smart)
      - *fácil → fáciles* (easy)
      - *azul → azules* (blue)

      Nationalities are the exception — they do have a feminine form, as
      you saw in lesson 3: *español → española*.
    examples:
      - ["una ciudad grande", "a big city"]
      - ["las mesas azules", "the blue tables"]
      - ["El español es fácil.", "Spanish is easy."]

  - heading: Where adjectives go
    body: |
      Most adjectives go **after** the noun — the opposite of English:
      *una casa blanca* (a white house).

      A few common ones often go before. **Bueno** (good) and **malo** (bad)
      lose their -o in front of a masculine singular noun: *un buen amigo*,
      *un mal día*.

      **Muy** (very) never changes: *muy alto, muy alta, muy altos*.
    examples:
      - ["un libro rojo", "a red book"]
      - ["Es un buen amigo.", "He's a good friend."]
      - ["Las chicas son muy altas.", "The girls are very tall."]

  - heading: "This and these: este, esta, estos, estas"
    body: |
      "This" also matches its noun. It goes before the noun, like in
      English.
    table:
      columns: ["", singular, plural]
      rows:
        - [masculine, este libro, estos libros]
        - [feminine, esta casa, estas casas]
    examples:
      - ["Este libro es muy bueno.", "This book is very good."]
      - ["Esta ciudad es grande.", "This city is big."]
      - ["Estas chicas son de Chile.", "These girls are from Chile."]
    tip: "*Esta* (this) has no accent mark. *Está* (is), from lesson 6, does. *Esta chica está aquí* — this girl is here."

words:
  - [alto, tall]
  - [bajo, short (height)]
  - [grande, big]
  - [pequeño, small]
  - [nuevo, new]
  - [viejo, old]
  - [bueno, good]
  - [malo, bad]
  - [bonito, "pretty, nice"]
  - [fácil, easy]
  - [difícil, difficult]
  - [rojo, red]
  - [blanco, white]
  - [azul, blue]
  - [muy, very]
  - [este / esta, this]

practice:
  - type: fill
    prompt: "una casa ___"
    hint: small
    translation: a small house
    answers: [pequeña]
    why: Casa is feminine, so pequeño becomes pequeña.

  - type: fill
    prompt: "los chicos ___"
    hint: tall
    translation: the tall boys
    answers: [altos]
    why: Chicos is masculine plural, so alto becomes altos.

  - type: fill
    prompt: "___ libro"
    hint: this
    translation: this book
    answers: [este]
    why: Libro is masculine, so "this" is este.

  - type: fill
    prompt: "Las mesas son ___."
    hint: blue
    translation: The tables are blue.
    answers: [azules]
    why: Azul ends in a consonant, so the plural adds -es.

  - type: fill
    prompt: "Es un ___ amigo."
    hint: good
    translation: He's a good friend.
    answers: [buen]
    why: Bueno drops its -o before a masculine singular noun.

  - type: translate
    direction: to-target
    prompt: a red book
    answers: [un libro rojo]
    why: Colours go after the noun in Spanish.

  - type: translate
    direction: to-target
    prompt: These houses are very big.
    answers: [Estas casas son muy grandes]
    why: Estas matches feminine plural casas, and grande adds -s.

  - type: translate
    direction: to-target
    prompt: The girl is tall.
    answers: [La chica es alta]
    why: Describing what someone is like uses ser, and alto becomes alta for a girl.

  - type: translate
    direction: to-english
    prompt: Esta ciudad es muy bonita.
    answers: [This city is very pretty, This city is very beautiful, This city is very nice, This city is really pretty, This city is really beautiful]
    why: Esta is the feminine "this", and bonita matches ciudad.

  - type: translate
    direction: to-english
    prompt: El español no es difícil.
    answers: [Spanish is not difficult, Spanish is not hard]
    why: Difícil means "difficult"; no before the verb makes it negative.

  - type: choice
    prompt: Which is correct?
    options: [una casa blanco, una casa blanca, una blanca casa]
    answer: una casa blanca
    why: The adjective goes after the noun and matches it — casa is feminine.

  - type: choice
    prompt: "___ chica es de Perú. (this)"
    options: [Está, Esta]
    answer: Esta
    why: Esta without an accent means "this"; está with an accent means "is".
