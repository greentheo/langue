title: "¿Dónde está?"
subtitle: Estar, and ser vs estar
goal: say where things are and how people feel right now with *estar*, and choose between *ser* and *estar*
minutes: 12

sections:
  - heading: "Estar: the other \"to be\""
    body: |
      Spanish has two verbs for "to be". You know **ser** from lesson 3.
      The other one is **estar** — you've already used it in *¿Cómo
      estás?*

      Watch the accent marks: *estás*, *está*, *están*.
    table:
      columns: [who, estar, English]
      rows:
        - [yo, estoy, I am]
        - [tú, estás, you are]
        - [él / ella / usted, está, "he is, she is, you are"]
        - [nosotros / nosotras, estamos, we are]
        - [vosotros / vosotras, estáis, you all are]
        - [ellos / ellas / ustedes, están, "they are, you all are"]
    tip: "*Está* (is) needs its accent mark. Without it, *esta* is a different word — \"this\" — which you'll meet in lesson 10."

  - heading: Where things are
    body: |
      Use **estar** to say where someone or something is. Some useful words:

      - **aquí** — here
      - **allí** — there
      - **en** — in, on, at
      - **cerca** — near
      - **lejos** — far

      "At home" is just **en casa**, with no article.
    examples:
      - ["¿Dónde está la estación?", "Where's the station?"]
      - ["El libro está en la mesa.", "The book is on the table."]
      - ["Estamos en casa.", "We're at home."]
      - ["Madrid está lejos.", "Madrid is far away."]
    tip: "Even things that never move use *estar* for where they are: *Madrid está en España.*"

  - heading: How you feel right now
    body: |
      Use **estar** for feelings and states — how someone is at the moment.
      These words end in **-o** for males and **-a** for females, and add
      **-s** for more than one: *cansado, cansada, cansados, cansadas*.
    table:
      columns: [male, female, English]
      rows:
        - [cansado, cansada, tired]
        - [contento, contenta, happy]
        - [enfermo, enferma, sick]
        - [ocupado, ocupada, busy]
        - [triste, triste, sad]
    examples:
      - ["Estoy cansado.", "I'm tired. (a man or boy speaking)"]
      - ["Ella está contenta.", "She's happy."]
      - ["¿Estás enferma?", "Are you sick? (to a woman or girl)"]

  - heading: Ser or estar?
    body: |
      - **ser** is for what someone or something *is*: name, origin, nationality, job
      - **estar** is for *where* it is and *how* it is right now
    table:
      columns: [ser, estar]
      rows:
        - ["Soy Ana. (who I am)", "Estoy en casa. (where I am)"]
        - ["Es de Perú. (origin)", "Está en Perú. (location)"]
        - ["Somos estudiantes. (what we do)", "Estamos contentos. (how we feel)"]
    tip: "A handy rhyme: \"How you feel and where you are — that's when you use *estar*.\""

words:
  - [estar, "to be (location, feelings)"]
  - [dónde, where]
  - [baño, bathroom]
  - [estación, station]
  - [allí, there]
  - [cerca, near]
  - [lejos, far]
  - [en casa, at home]
  - [cansado, tired]
  - [contento, happy]
  - [triste, sad]
  - [enfermo, sick]
  - [ocupado, busy]

practice:
  - type: fill
    section: 1
    prompt: "Yo ___ en casa."
    hint: estar
    translation: I'm at home.
    answers: [estoy]
    why: Estoy is the yo form of estar, used for location.

  - type: fill
    section: 2
    prompt: "¿Dónde ___ el baño?"
    hint: estar
    translation: Where's the bathroom?
    answers: [está]
    why: Location uses estar; está is the form for one thing.

  - type: fill
    section: 3
    prompt: "Nosotros ___ cansados."
    hint: estar
    translation: We're tired.
    answers: [estamos]
    why: Feelings use estar; estamos is the nosotros form.

  - type: fill
    section: 3
    prompt: "Las chicas ___ contentas."
    hint: estar
    translation: The girls are happy.
    answers: [están]
    why: Están goes with ellos, ellas and ustedes.

  - type: choice
    section: 4
    prompt: "Ana ___ de Colombia."
    options: [es, está]
    answer: es
    why: Where someone is from uses ser.

  - type: choice
    section: 4
    prompt: "Ana ___ en Colombia."
    options: [es, está]
    answer: está
    why: Where someone is right now uses estar.

  - type: choice
    section: 4
    prompt: "Ellos ___ estudiantes."
    options: [son, están]
    answer: son
    why: What someone is — like their job — uses ser.

  - type: translate
    section: 3
    direction: to-target
    prompt: I'm tired. (a man speaking)
    answers: [Estoy cansado, Yo estoy cansado]
    why: Feelings use estar, and a man says cansado.

  - type: translate
    section: 2
    direction: to-target
    prompt: Where's the station?
    answers: ["¿Dónde está la estación?"]
    why: Location uses estar; estación is feminine, so it's la estación.

  - type: translate
    section: 3
    direction: to-target
    prompt: She's sad.
    answers: [Está triste, Ella está triste]
    why: How someone feels right now uses estar.

  - type: translate
    section: 2
    direction: to-english
    prompt: Estamos en casa.
    answers: [We are at home, We are home]
    why: En casa means "at home", without an article.

  - type: translate
    section: 2
    direction: to-english
    prompt: El hotel está cerca.
    answers: [The hotel is near, The hotel is close, The hotel is nearby, The hotel is close by]
    why: Cerca means "near"; location uses estar.
