title: Intermediate
summary: >-
  You can get by in most situations while travelling, tell a story, and explain
  your opinions and plans. This is the level of the DELE B1 exam.

can_do:
  - deal with most travel situations, including problems and complaints
  - describe experiences, events, hopes and ambitions
  - give reasons and explanations for your opinions and plans
  - follow the main points of clear TV, radio and podcasts on familiar topics
  - tell a story or the plot of a book or film
  - write connected text about experiences and impressions

grammar:
  - topic: "Pluperfect: había comido"
  - topic: "Conditional: comería, podría"
  - topic: "Present subjunctive after wishes, feelings and doubt: quiero que vengas, ojalá, es importante que"
  - topic: "Present perfect subjunctive: espero que hayas dormido bien"
  - topic: "Formal and negative commands: ¡venga!, ¡no hables!"
  - topic: "Commands and verbs with pronouns: dímelo, se lo doy"
  - topic: "Relative pronouns: que, quien, donde, lo que"
  - topic: "Si + present: si llueve, me quedo en casa"
  - topic: "Future of probability: serán las diez"
  - topic: Por and para in full
  - topic: "Verb phrases: acabar de, volver a, dejar de, seguir + gerund"
  - topic: "Connectors: sin embargo, aunque, por eso, ya que"

themes:
  - work and careers
  - education
  - media
  - environment
  - relationships
  - feelings
  - culture
