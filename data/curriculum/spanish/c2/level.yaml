title: Mastery
summary: >-
  You understand virtually everything and can express fine shades of meaning
  precisely. This is the level of the DELE C2 exam.

can_do:
  - understand virtually everything you hear or read
  - summarise information from different sources, reconstructing arguments coherently
  - express yourself spontaneously, very fluently and precisely, with fine shades of meaning

grammar:
  - topic: "Literary and archaic forms: the future subjunctive in legal texts (quien fuere), the past anterior (hubo terminado)"
  - topic: Style, irony and rhetoric
  - topic: "Proverbs (refranes), idioms and cultural references"
  - topic: "Specialised registers: legal, academic, journalistic"
  - topic: Precision in collocation and connotation

themes:
  - literature
  - specialised fields
  - culture and society
