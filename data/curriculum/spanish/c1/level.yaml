title: Advanced
summary: >-
  You can understand demanding texts and what is implied, and adjust your
  Spanish for social, academic and professional situations. This is the level
  of the DELE C1 exam.

can_do:
  - understand long, demanding texts and recognise what is implied
  - express yourself fluently and spontaneously without searching for words
  - use Spanish flexibly for social, academic and professional purposes
  - write clear, well-structured, detailed text on complex subjects

grammar:
  - topic: "Subtle mood choice: the subjunctive in relative and independent clauses (busco a alguien que sepa…, ¡que te vaya bien!, quizás)"
  - topic: "Ser and estar with adjectives that change meaning: ser listo / estar listo"
  - topic: "Cleft and emphatic sentences: lo que necesito es…, fue ella quien…"
  - topic: "Idiomatic pronominal verbs: quedarse, llevarse, pasarse, apañárselas"
  - topic: "Discourse markers: no obstante, por consiguiente, en cambio, dado que"
  - topic: "Register and regional variation: voseo, vosotros vs ustedes, leísmo"
  - topic: Nominalisation and formal style

themes:
  - academic life
  - professional life
  - culture
  - humour
  - nuance
