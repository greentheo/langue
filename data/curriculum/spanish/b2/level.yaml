title: Upper intermediate
summary: >-
  You can understand complex texts, talk with native speakers without strain,
  and argue a point of view. This is the level of the DELE B2 exam.

can_do:
  - understand the main ideas of complex texts, including technical discussion in your field
  - follow news, films and series in standard Spanish
  - talk with native speakers fluently and spontaneously, without strain on either side
  - explain a viewpoint on a topical issue, with advantages and disadvantages
  - write clear, detailed essays, reports and formal letters

grammar:
  - topic: "Imperfect and pluperfect subjunctive: si tuviera…, si hubiera sabido…"
  - topic: Sequence of tenses
  - topic: All three kinds of "if" sentence
  - topic: "Conditional perfect and future perfect: habría ido, habré terminado"
  - topic: "The passive (ser + participle) and passive or impersonal se: se venden pisos"
  - topic: Reported speech
  - topic: "Conjunctions that take the subjunctive: para que, antes de que, a menos que, con tal de que, aunque"
  - topic: "Relative clauses with prepositions: el que, la cual, cuyo"
  - topic: "Word formation: -ito, -azo, -ón"

themes:
  - society
  - politics
  - economy
  - science and technology
  - the arts
  - debate
