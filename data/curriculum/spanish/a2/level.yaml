title: Elementary
summary: >-
  You can handle everyday situations and talk about your past and your plans in
  simple terms. This is the level of the DELE A2 exam.

can_do:
  - talk about what you did last weekend, on holiday, or as a child
  - make plans and arrangements with friends
  - handle routine transactions — transport, hotels, clothes shopping, the pharmacy
  - describe people, places, your home and your background
  - ask for and give directions
  - compare things and say which you prefer
  - write short notes, messages and simple emails

grammar:
  - topic: "Preterite: regular verbs and the common irregulars (fui, hice, tuve, estuve)"
    lessons: [01-preterite-regular, 02-preterite-fui-hice, 03-preterite-tuve-estuve]
  - topic: Reflexive verbs in the past
    lessons: [04-reflexive-past]
  - topic: "Hace + time (hace dos años) and desde hace"
    lessons: [05-hace-desde-hace]
  - topic: "Comparatives and superlatives: más … que, el mejor, -ísimo"
    lessons: [06-comparatives]
  - topic: "Imperfect: era, tenía, vivía — and when to use it instead of the preterite"
    lessons: [07-imperfect, 08-imperfect-preterite]
  - topic: "Present perfect: he comido, has visto (used a lot in Spain)"
    lessons: [09-present-perfect]
  - topic: "Direct and indirect object pronouns: lo, la, le, me, te"
    lessons: [10-object-pronouns]
  - topic: "Estar + gerund: estoy comiendo"
    lessons: [11-estar-gerund]
  - topic: "Simple future: hablaré, iré"
    lessons: [12-future]
  - topic: "Conditional for politeness: ¿podría…?, me gustaría"
    lessons: [13-conditional]
  - topic: "Informal commands: ¡habla!, ¡come!, ¡ven!"
    lessons: [14-commands]
  - topic: "Saber vs conocer; a first look at por vs para"
    lessons: [15-saber-conocer-por-para]

themes:
  - travel and holidays
  - transport
  - clothes
  - health
  - weather
  - the home
  - work and school
  - childhood memories

# The ten sub-levels, A2.1 to A2.10, in teaching order. Lessons stay in
# number order, because each lesson's practice may use earlier lessons.
units:
  - title: What did you do?
    lessons: [01-preterite-regular]
    situations: [stories]
    categories: [verbs, time]
  - title: Trips and holidays
    lessons: [02-preterite-fui-hice, 03-preterite-tuve-estuve]
    situations: [travel]
    categories: [travel]
  - title: Getting ready
    lessons: [04-reflexive-past]
    situations: [clothes]
    categories: [clothing, shopping]
  - title: Feeling better
    lessons: [05-hace-desde-hace, 06-comparatives]
    situations: [health]
    categories: [health]
  - title: When I was little
    lessons: [07-imperfect]
    categories: [family, work]
  - title: What happened?
    lessons: [08-imperfect-preterite]
    situations: [phone]
    categories: [technology, emotions]
  - title: Have you ever…?
    lessons: [09-present-perfect]
    situations: [restaurant]
    categories: [food, education]
  - title: Around the house
    lessons: [10-object-pronouns, 11-estar-gerund]
    situations: [home]
    categories: [housing, leisure]
  - title: Will and would
    lessons: [12-future, 13-conditional]
    situations: [hotel]
    categories: [nature]
  - title: Come with me!
    lessons: [14-commands, 15-saber-conocer-por-para]
    situations: [plans]
    categories: [transportation]
