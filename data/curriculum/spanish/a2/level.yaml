title: Elementary
summary: >-
  You can handle everyday situations and talk about your past and your plans in
  simple terms. This is the level of the DELE A2 exam.

can_do:
  - talk about what you did last weekend, on holiday, or as a child
  - make plans and arrangements with friends
  - handle routine transactions — transport, hotels, clothes shopping, the pharmacy
  - describe people, places, your home and your background
  - ask for and give directions
  - compare things and say which you prefer
  - write short notes, messages and simple emails

grammar:
  - topic: "Present perfect: he comido, has visto (used a lot in Spain)"
  - topic: "Preterite: regular verbs and the common irregulars (fui, hice, tuve, estuve)"
  - topic: "Imperfect: era, tenía, vivía — and when to use it instead of the preterite"
  - topic: Reflexive verbs in the past
  - topic: "Direct and indirect object pronouns: lo, la, le, me, te"
  - topic: "Simple future: hablaré, iré"
  - topic: "Estar + gerund: estoy comiendo"
  - topic: "Comparatives and superlatives: más … que, el mejor, -ísimo"
  - topic: "Informal commands: ¡habla!, ¡come!, ¡ven!"
  - topic: "Conditional for politeness: ¿podría…?, me gustaría"
  - topic: "Hace + time (hace dos años) and desde hace"
  - topic: "Saber vs conocer; a first look at por vs para"

themes:
  - travel and holidays
  - transport
  - clothes
  - health
  - weather
  - the home
  - work and school
  - childhood memories
