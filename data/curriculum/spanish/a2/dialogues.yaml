    lines:
      - them: ¡Hola! ¿Qué tal el día?
        english: Hi! How was your day?
      - you: Say you've passed the history exam!
        answers:
          - ¡He aprobado el examen de historia!
          - ¡Aprobé el examen de historia!
          - ¡Hoy he aprobado el examen de historia!
      - them: ¡Qué bien! ¿Qué nota has sacado?
        english: Great! What grade did you get?
      - you: Say you got a nine.
        answers:
          - He sacado un nueve.
          - Saqué un nueve.
          - He sacado nueve.
          - Un nueve.
      - them: ¡Muy bien! ¿Y ya has hecho la tarea?
        english: Very good! And have you done your homework yet?
      - you: Say not yet.
        answers:
          - Todavía no.
          - No, todavía no.
          - Todavía no he hecho la tarea.
          - No, todavía no he hecho la tarea.
      - them: ¿Y por qué no?
        english: And why not?
      - you: Say you've played soccer all afternoon.
        answers:
          - He jugado al fútbol toda la tarde.
          - Porque he jugado al fútbol toda la tarde.
          - Porque he jugado fútbol toda la tarde.
          - Porque jugué al fútbol toda la tarde.
      - them: Bueno, primero la tarea y después la tele.
        english: OK — homework first, and then TV.
      - you: Say OK, you'll do your homework now.
        answers:
          - De acuerdo. Hago la tarea ahora.
          - De acuerdo, ahora hago la tarea.
          - Vale, hago la tarea ahora.
          - Está bien. Voy a hacer la tarea ahora.

  # ── Unit 8: Around the house ────────────────────────────────────────────
