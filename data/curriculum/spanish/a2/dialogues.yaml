          - De acuerdo, y también saco la basura.
          - Está bien. Yo saco la basura también.
          - Claro. Y yo saco la basura.
      - them: ¡Gracias! Ah, y apaga la tele, por favor.
        english: Thanks! Oh, and turn off the TV, please.
      - you: Say yes, you're turning it off now.
        answers:
          - Sí, ya la apago.
          - Sí, la apago ahora.
          - Ahora la apago.
          - Sí, ahora mismo la apago.

  # ── Unit 9: Will and would ──────────────────────────────────────────────
  - id: hotel-problem
    unit: 9
    title: A problem with the room
    setting: You've just checked in at a small hotel in Cartagena, Colombia. Ten minutes later, you're back at reception.
    with: the receptionist
    lines:
      - them: Buenas noches. ¿Hay algún problema?
        english: Good evening. Is there a problem?
      - you: Say yes, there's a problem with the room.
        answers:
          - Sí, hay un problema con la habitación.
          - Hay un problema con la habitación.
          - Sí, hay un problema con mi habitación.
      - them: ¿Qué pasa?
        english: What's wrong?
      - you: Say the air conditioning doesn't work.
        answers:
          - El aire acondicionado no funciona.
          - No funciona el aire acondicionado.
          - El aire acondicionado no funciona bien.
      - them: ¡Uy, lo siento! El técnico no está. Vendrá mañana a las nueve.
        english: Oh, I'm sorry! The repairman isn't here. He'll come tomorrow at nine.
      - you: Say there's no hot water either.
        answers:
          - Y tampoco hay agua caliente.
          - Tampoco hay agua caliente.
          - Y no hay agua caliente.
          - Y no hay agua caliente tampoco.
      - them: ¡No me diga! Lo siento mucho.
        english: Oh no! I'm very sorry.
      - you: Ask politely if you could change rooms.
        answers:
          - ¿Podría cambiar de habitación, por favor?
          - ¿Podría cambiar de habitación?
          - ¿Me podría cambiar de habitación, por favor?
          - ¿Podría darme otra habitación, por favor?
          - ¿Puedo cambiar de habitación, por favor?
      - them: Claro. Le doy la 310. Es más grande y tiene vista al mar.
        english: Of course. I'll give you 310. It's bigger, and it has a sea view.
      - you: Thank him, and ask if he could also give you another towel.
        answers:
          - Muchas gracias. ¿Me podría dar otra toalla también?
          - Gracias. ¿Me podría dar otra toalla?
          - Muchas gracias. ¿Podría darme otra toalla?
          - Muchas gracias. ¿Me podría dar otra toalla, por favor?
      - them: Por supuesto. Enseguida se la llevo.
        english: Of course. I'll bring it up right away.

  - id: rainy-forecast
    unit: 9
    title: A trip to the lake
    setting: It's Friday evening. Your friend Pedro calls about the trip to the lake you planned for Saturday.
    with: Pedro
    lines:
      - them: ¡Hola! Mañana vamos al lago, ¿no?
        english: Hi! We're going to the lake tomorrow, right?
      - you: Say yes, but it will rain tomorrow.
        answers:
          - Sí, pero mañana lloverá.
          - Sí, pero lloverá mañana.
          - Sí, pero mañana va a llover.
          - Sí, pero el pronóstico dice que mañana lloverá.
      - them: ¡Ay, no! ¿Y el domingo?
        english: Oh, no! And on Sunday?
      - you: Say on Sunday it will be sunny.
        answers:
          - El domingo hará sol.
          - El domingo va a hacer sol.
          - El domingo estará soleado.
          - El domingo hará buen tiempo.
      - them: ¡Perfecto! ¿Vamos el domingo, entonces?
        english: Perfect! Shall we go on Sunday, then?
      - you: Say you'd love to, and you'll bring the food.
        answers:
          - ¡Me encantaría! Yo llevaré la comida.
          - ¡Me encantaría! Llevaré la comida.
          - ¡Sí, me encantaría! Yo llevo la comida.
          - ¡Claro! Yo llevaré la comida.
      - them: ¡Genial! ¿A qué hora salimos?
        english: Great! What time shall we leave?
      - you: Say you could leave at eight.
        answers:
          - Podríamos salir a las ocho.
          - Podemos salir a las ocho.
          - Saldremos a las ocho.
      - them: ¿A las ocho? ¡Qué temprano! Bueno, de acuerdo.
        english: At eight? That's so early! Well, OK.

  # ── Unit 10: Come with me! ──────────────────────────────────────────────
  - id: concert-saturday
    unit: 10
    title: A concert on Saturday
    setting: Your friend Martina calls you on Thursday evening.
    with: Martina
    lines:
      - them: ¡Hola! ¿Tienes planes para el sábado?
        english: Hi! Do you have plans for Saturday?
      - you: Say no — why?
        answers:
          - No, ¿por qué?
          - No, no tengo planes. ¿Por qué?
          - Todavía no. ¿Por qué?
      - them: Tengo dos entradas para un concierto. ¿Te gustaría venir?
        english: I have two tickets for a concert. Would you like to come?
      - you: Say you'd love to, and thank her for the invitation.
        answers:
          - ¡Me encantaría! Gracias por la invitación.
          - ¡Me encantaría! Muchas gracias por la invitación.
          - ¡Sí, me encantaría! Gracias por la invitación.
          - ¡Claro que sí! Gracias por la invitación.
      - them: ¡Genial! Empieza a las ocho. ¿Nos vemos a las siete en mi casa?
        english: Great! It starts at eight. Shall we meet at seven at my place?
      - you: Say sorry, you can't at seven. Suggest half past seven.
        answers:
          - Lo siento, no puedo a las siete. ¿Mejor a las siete y media?
          - Lo siento, a las siete no puedo. ¿Mejor a las siete y media?
          - Lo siento, no puedo a las siete. ¿Nos vemos a las siete y media?
          - A las siete no puedo. ¿Qué tal a las siete y media?
      - them: Sí, perfecto. ¿Sabes dónde vivo?
        english: Yes, perfect. Do you know where I live?
      - you: Say no, and ask her to send you the address.
        answers:
          - No. Mándame la dirección, por favor.
          - No, no sé. Mándame la dirección, por favor.
          - No. ¿Me mandas la dirección?
          - No, no sé dónde vives. ¿Me mandas la dirección?
      - them: ¡Claro! Te mando un mensaje ahora.
        english: Sure! I'll text you now.
      - you: Say perfect, see you on Saturday.
        answers:
          - Perfecto. Nos vemos el sábado.
          - ¡Genial! Nos vemos el sábado.
          - De acuerdo. Nos vemos el sábado.
          - Perfecto, hasta el sábado.

  - id: directions-home
    unit: 10
    title: How do I get to your house?
    setting: Your friend Ana is coming to your house in Montevideo for the first time. She calls you from the bus stop.
    with: Ana
    lines:
      - them: ¡Hola! Ya me bajé del autobús. ¿Cómo llego a tu casa?
        english: Hi! I've just got off the bus. How do I get to your house?
      - you: Tell her to cross the street first.
        answers:
          - Primero, cruza la calle.
          - Cruza la calle primero.
          - Cruza la calle.
      - them: Listo. ¿Y ahora?
        english: Done. And now?
      - you: Tell her to go straight on as far as the traffic light.
        answers:
          - Sigue todo recto hasta el semáforo.
          - Sigue todo derecho hasta el semáforo.
          - Sigue derecho hasta el semáforo.
      - them: Ya estoy en el semáforo.
        english: I'm at the traffic light now.
      - you: Tell her to turn left.
        answers:
          - Gira a la izquierda.
          - Dobla a la izquierda.
          - Ahora gira a la izquierda.
          - Ahora dobla a la izquierda.
      - them: ¡Uy, creo que me perdí! Hay una panadería en la esquina.
        english: Oops, I think I'm lost! There's a bakery on the corner.
      - you: Say you know it — your house is next to the bakery.
        answers:
          - ¡La conozco! Mi casa está al lado de la panadería.
          - Mi casa está al lado de la panadería.
          - ¡Ah, la conozco! Mi casa está al lado.
      - them: ¡Ah, ya te veo!
        english: Oh, I can see you now!
      - you: Say hi, and tell her to come in.
        answers:
          - ¡Hola! Pasa, por favor.
          - ¡Hola, Ana! Pasa.
          - Hola, pasa.
          - ¡Hola! Entra, por favor.
