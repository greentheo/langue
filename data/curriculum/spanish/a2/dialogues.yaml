          - Ahora mismo estoy viendo una serie.
          - Veo una serie.
      - them: Oye, ¿me ayudas a poner la mesa? Comemos en diez minutos.
        english: Hey, can you help me set the table? We're eating in ten minutes.
      - you: Say of course, you'll help her.
        answers:
          - Claro, te ayudo.
          - Sí, claro, te ayudo.
          - Claro que sí. Te ayudo.
          - Sí, te ayudo.
      - them: Gracias. ¿Y el pan? ¿Lo compraste?
        english: Thanks. And the bread? Did you buy it?
