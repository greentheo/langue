title: Upper intermediate
summary: >
  At B2 you can hold your own with native speakers: follow news and films,
  argue a point of view, and write clear, detailed texts — including on
  topics that are abstract or technical.

can_do:
  - understand the main ideas of complex texts, including technical discussion in your field
  - follow news, films and TV series in standard Italian
  - talk with native speakers fluently and spontaneously, without strain on either side
  - explain a viewpoint on a current issue, giving the advantages and disadvantages
  - write clear, detailed essays, reports and formal letters
  - summarise and comment on articles and interviews

grammar:
  - topic: Congiuntivo imperfetto and trapassato, and the sequence of tenses
  - topic: All three kinds of if sentence, including impossible ones — se avessi saputo, sarei venuto
  - topic: "The passive: essere, venire and andare + participle, and the si passivante"
  - topic: Impersonal si — si dice, ci si alza
  - topic: Reported speech, with its tense changes
  - topic: Using the passato remoto in narration
  - topic: "Implicit clauses: gerundio passato, participio passato — finito il lavoro…"
  - topic: "Conjunctions that take the subjunctive: benché, affinché, purché, a meno che, prima che"
  - topic: "Indefinites: qualunque, chiunque, nessuno, alcuni"
  - topic: "Word formation: -ino, -one, -accio and common prefixes"

themes:
  - society
  - politics and the economy
  - science and technology
  - the arts
  - debate and opinion
