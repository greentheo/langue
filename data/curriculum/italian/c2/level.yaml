title: Mastery
summary: >
  C2 is near-native command: you understand virtually everything, and you
  express fine shades of meaning precisely, in any register.

can_do:
  - understand virtually everything you hear or read, with ease
  - summarise information from several spoken and written sources, rebuilding the arguments clearly
  - express yourself spontaneously, very fluently and precisely
  - make fine distinctions of meaning, even in complex situations
  - read literature, including older texts, and appreciate style, irony and wordplay

grammar:
  - topic: Literary forms — passato remoto and trapassato remoto in prose, egli, ella, esso
  - topic: Style, irony and rhetoric
  - topic: Proverbs, idioms and cultural references
  - topic: "Specialised registers: legal, academic, journalistic"
  - topic: Precise collocation and connotation

themes:
  - literature
  - specialised fields
  - Italian culture and history
