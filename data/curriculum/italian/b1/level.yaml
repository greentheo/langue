title: Intermediate
summary: >
  The threshold of independence. At B1 you can deal with most situations
  while travelling, talk about experiences, hopes and plans, and explain your
  opinions — not perfectly, but without needing to plan every sentence.

can_do:
  - deal with most travel situations, including unexpected problems and complaints
  - describe experiences, events, dreams, hopes and ambitions
  - give reasons and short explanations for your opinions and plans
  - tell a story, or the plot of a film or book, and say how you reacted
  - follow the main points of clear TV and radio on familiar topics
  - take part in conversations on familiar topics without preparing
  - write connected text about experiences and impressions

grammar:
  - topic: Condizionale presente and passato (I would, I would have)
  - topic: Congiuntivo presente and passato after opinions, wishes and doubts — penso che, spero che
  - topic: Trapassato prossimo (I had done)
  - topic: Futuro anteriore, and the future for guessing — sarà a casa
  - topic: "Combined pronouns: me lo, te la, glielo, ce ne"
  - topic: The formal imperative, and the imperative with pronouns — dimmi, fallo
  - topic: "Relative pronouns: che, cui, il quale, chi"
  - topic: "Pronominal verbs: andarsene, farcela, metterci, volerci, cavarsela"
  - topic: Gerund and infinitive constructions — prima di partire, dopo aver mangiato
  - topic: "If sentences: real (se piove, resto) and possible (se potessi, andrei)"
  - topic: Recognising the passato remoto in stories
  - topic: "Connectors: però, quindi, mentre, siccome, perciò, anche se, invece"

themes:
  - work and careers
  - education
  - media and news
  - the environment
  - relationships and feelings
  - culture and traditions
  - plans and ambitions
