title: Elementary
summary: >
  You can get by. At A2 you start talking about the past and the future,
  handle routine trips and errands on your own, and describe people, places
  and your own background in simple terms.

can_do:
  - say what you did last weekend or on holiday, and what you used to do as a child
  - make plans and arrangements with friends
  - handle routine situations on a trip — transport, hotels, restaurants
  - shop for clothes and ask for sizes, colours and prices
  - explain simple problems at a pharmacy or with a doctor
  - describe people, places, your home town and your background
  - understand the main point of short, clear announcements and messages
  - write short notes, messages and simple personal emails

grammar:
  - topic: Passato prossimo with avere and essere (I ate, I went)
  - topic: Irregular past participles — fatto, detto, visto, preso, messo, scritto
  - topic: Imperfetto, and when to use it instead of the passato prossimo
  - topic: Reflexive verbs in the past — mi sono alzato
  - topic: Direct object pronouns — lo, la, li, le
  - topic: Indirect object pronouns — mi, ti, gli, le
  - topic: Ci (there) and ne (of it, of them)
  - topic: Futuro semplice (I will go)
  - topic: Stare + gerund for actions in progress — sto mangiando
  - topic: "Comparatives and superlatives: più … di, il più, -issimo, migliore"
  - topic: The partitive — del pane, delle mele
  - topic: The informal imperative — mangia!, non mangiare!
  - topic: The conditional for politeness — potrei, mi piacerebbe
  - topic: "Time expressions: fa, da, già, ancora, appena"
  - topic: Sapere and conoscere — two ways to know

themes:
  - travel and holidays
  - transport
  - clothes and shopping
  - health
  - weather
  - house and rooms
  - work and school
  - childhood memories
