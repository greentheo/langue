title: Advanced
summary: >
  At C1 Italian becomes a working language. You understand what is implied
  as well as what is said, and you switch easily between casual, academic and
  professional registers.

can_do:
  - understand long, demanding texts and recognise implicit meaning
  - express yourself fluently and spontaneously without obviously searching for words
  - use the language flexibly for social, academic and professional purposes
  - adjust your register to the situation, from friendly chat to formal meetings
  - write clear, well-structured, detailed text on complex subjects
  - follow lectures, debates and films with slang or regional accents

grammar:
  - topic: Fine choices of mood — the subjunctive in relative clauses (cerco qualcuno che sappia…)
  - topic: The independent subjunctive — magari!, che entri pure
  - topic: Cleft and dislocated sentences — è lui che…, il caffè lo prendo amaro
  - topic: Nominal and formal style, including bureaucratic Italian
  - topic: Idiomatic pronominal verbs — prendersela, cavarsela, fregarsene
  - topic: "Discourse markers: tuttavia, pertanto, ciononostante, dal momento che"
  - topic: Register and regional variation
  - topic: Recognising the trapassato remoto

themes:
  - academic and professional life
  - culture and the arts
  - nuance and humour
  - current affairs in depth
