title: "No Brasil, na praia"
subtitle: Prepositions and their contractions
goal: say in, at, to, from and through with em, a, de and por — and join them with o, a, os and as
minutes: 13

sections:
  - heading: Little words that join
    body: |
      Four small words do a lot of work:

      - **em** — in, on, at
      - **de** — of, from
      - **a** — to, at
      - **por** — through, by, for

      When they meet *o, a, os, as*, they join into one word. You already know
      **do, da** (lesson 13). Here is the whole set:
    table:
      columns: ["", "+ o", "+ a", "+ os", "+ as"]
      rows:
        - [em, "no", na, nos, nas]
        - [de, do, da, dos, das]
        - [a, ao, "à", aos, "às"]
        - [por, pelo, pela, pelos, pelas]
    tip: "Now you know where the accent in *às sete* comes from: *a* (at) + *as* (horas) = *às*."

  - heading: Em — in, on, at
    body: |
      **Em** covers English *in*, *on* and *at*:

      - *Moro no Brasil.* — I live in Brazil. (em + o)
      - *Estou na escola.* — I'm at school. (em + a)
      - *O livro está na mesa.* — The book is on the table.

      Most cities take no article, so *em* stays *em*: *Moro em São Paulo.*
      Most countries do take one: *no Brasil, nos Estados Unidos*.

      In speech, *em + um / uma* often become **num / numa**: *Moro numa casa
      grande* (= *em uma casa*).
    examples:
      - ["Ele trabalha no mercado.", "He works at the market."]
      - ["As crianças estão na praia.", "The children are at the beach."]
      - ["Moro numa cidade pequena.", "I live in a small town."]

  - heading: A — to, at
    body: |
      In writing, **a** means "to" a place: *Vamos ao cinema.* (a + o) — We're
      going to the cinema. *Vou à praia.* (a + a) — I'm going to the beach.

      In everyday speech Brazilians prefer *para / pra* (lesson 12): *Vou pra
      praia.* You'll even hear *vou no cinema* — very common in speech, but
      not correct in writing.
    examples:
      - ["Vamos ao cinema hoje?", "Shall we go to the cinema today?"]
      - ["Ela vai à escola de manhã.", "She goes to school in the morning."]

  - heading: Por — through, by, for
    body: |
      **Por** joins into **pelo, pela, pelos, pelas**:

      - *Passamos pelo parque.* — We go through the park.
      - *Obrigado pela ajuda.* — Thanks for the help.
    tip: "Thanking someone *for* something always uses *por*: *obrigada pelo café*, *obrigado pela ajuda*."

words:
  - [em, in / on / at]
  - [de, of / from]
  - [a, to / at]
  - [por, through / by / for]
  - [mesa, table]
  - [escola, school]
  - [cinema, cinema / movie theater]
  - [parque, park]
  - [ajuda, help]
  - [mercado, market]
  - [crianças, children]
  - [país, country]
  - [Estados Unidos, United States]
  - [passar, to pass / to go through]

practice:
  - type: fill
    section: 2
    prompt: "Moro ___ Brasil."
    hint: em + o
    translation: I live in Brazil.
    answers: ["no"]
    why: Em + o joins into no.

  - type: fill
    section: 2
    prompt: "Ela está ___ escola."
    hint: em + a
    translation: She is at school.
    answers: [na]
    why: Em + a joins into na.

  - type: fill
    section: 3
    prompt: "Vamos ___ cinema."
    hint: a + o
    translation: Let's go to the cinema.
    answers: [ao]
    why: A + o joins into ao.

  - type: fill
    section: 4
    prompt: "Obrigada ___ ajuda."
    hint: por + a
    translation: Thanks for the help.
    answers: [pela]
    why: Thanking someone for something uses por, and por + a becomes pela.

  - type: fill
    section: 1
    prompt: "Eles são ___ Estados Unidos."
    hint: de + os
    translation: They are from the United States.
    answers: [dos]
    why: Os Estados Unidos is plural, so de + os becomes dos.

  - type: choice
    section: 2
    prompt: "\"I live in São Paulo.\""
    options: [Moro no São Paulo., Moro em São Paulo., Moro na São Paulo.]
    answer: Moro em São Paulo.
    why: Most cities take no article, so em stays em.

  - type: choice
    section: 1
    prompt: "\"at three o'clock\""
    options: [às três, as três, a três]
    answer: às três
    why: At + a time is a + as (horas), which joins into às.

  - type: choice
    section: 3
    prompt: "\"We're going to the beach.\" (written Portuguese)"
    options: [Vamos à praia., Vamos a praia., Vamos na praia.]
    answer: Vamos à praia.
    why: A + a joins into à, with a backwards accent.

  - type: translate
    section: 2
    direction: to-target
    prompt: The book is on the table.
    answers: [O livro está na mesa., O livro está em cima da mesa.]
    why: Em means "on" as well as "in", and em + a mesa becomes na mesa.

  - type: translate
    section: 2
    direction: to-target
    prompt: I live in a big house.
    answers: [Moro numa casa grande., Eu moro numa casa grande., Moro em uma casa grande., Eu moro em uma casa grande.]
    why: Em + uma can join into numa.

  - type: translate
    section: 4
    direction: to-english
    prompt: Passamos pelo parque.
    answers: [We go through the park., We pass through the park., We walk through the park., We go by the park., We pass by the park.]
    why: Pelo is por + o — through (or by) the park.

  - type: translate
    section: 2
    direction: to-english
    prompt: Ele trabalha no mercado.
    answers: [He works at the market., He works in the market., He works at the supermarket., He works at the grocery store.]
    why: No is em + o — at the market.
