title: Advanced
summary: >
  Flexible and precise: you can switch register for social, academic and
  professional life, and you notice regional differences. Roughly Celpe-Bras
  "Avançado", and DAPLE in Portugal's CAPLE exams.
can_do:
  - understand long, demanding texts and what they imply
  - express yourself fluently and spontaneously without searching for words
  - switch register for social, academic and professional situations
  - write well-structured, detailed text on complex subjects
  - recognise the main differences between Brazilian regions, and between Brazil and Portugal
grammar:
  - topic: Subtle mood choice — subjunctive in relative clauses (procuro alguém que saiba…) and in wishes (tomara que, quem dera)
  - topic: Emphasis and word order — é que, foi… que, topicalisation (esse filme, eu já vi)
  - topic: Formal and academic style, nominalisation
  - topic: Discourse markers — contudo, todavia, no entanto, portanto, ademais
  - topic: Colloquial Brazilian grammar — a gente, dropped objects, ter for "there is", ele as an object
  - topic: Idioms and fixed expressions (pagar o pato, chutar o balde, dar um jeito)
  - topic: Regional variation — carioca, paulista, nordestino, gaúcho; Brazil vs Portugal
themes:
  - academic life
  - professional life
  - culture and humour
  - regional Brazil
