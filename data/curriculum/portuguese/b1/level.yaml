title: Intermediate
summary: >
  The threshold level: you can cope with most situations on your own and
  explain your opinions. Roughly the "Intermediário" level of Brazil's
  Celpe-Bras exam, and DEPLE in Portugal's CAPLE exams.
can_do:
  - deal with most travel situations, including problems and complaints
  - describe experiences, events, hopes and ambitions
  - give reasons and explanations for your opinions and plans
  - follow the main points of clear TV and radio on familiar topics
  - tell a story or the plot of a film or book
  - write connected text about experiences and impressions
grammar:
  - topic: Futuro do pretérito (conditional) for all verbs — falaria, faria
  - topic: Presente do subjuntivo — wishes, doubts and opinions (espero que, é importante que, talvez)
  - topic: Futuro do subjuntivo — quando eu puder, se você tiver tempo
  - topic: Imperfeito do subjuntivo in "if" sentences (se eu tivesse… faria)
  - topic: Pretérito mais-que-perfeito composto (tinha feito)
  - topic: Pretérito perfeito composto and how it differs from English (tenho estudado)
  - topic: The personal infinitive (para nós entendermos)
  - topic: Relative pronouns — que, quem, onde, o qual; recognising cujo
  - topic: Object pronoun placement in Brazil and Portugal (me ajuda / ajuda-me)
  - topic: Passive voice with ser + participle, and vende-se
  - topic: Connectors — porém, então, por isso, embora, já que, apesar de
  - topic: Reported speech — basic patterns
themes:
  - work and careers
  - education
  - media
  - environment
  - relationships and feelings
  - culture and traditions
