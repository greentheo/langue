title: Upper intermediate
summary: >
  Independent and fluent: you can argue a point, follow the news and talk with
  Brazilians without strain on either side. Roughly Celpe-Bras
  "Intermediário Superior", and DIPLE in Portugal's CAPLE exams.
can_do:
  - understand complex texts, including technical discussion in your field
  - follow news, documentaries and films in standard Portuguese
  - talk with native speakers without strain on either side
  - explain a viewpoint on a topical issue, giving pros and cons
  - write clear, detailed essays, reports and formal emails
grammar:
  - topic: The full subjunctive — present, imperfect, future, perfect and pluperfect — and the sequence of tenses
  - topic: All three kinds of "if" sentence, including se eu tivesse sabido, teria…
  - topic: Conjunctions that take the subjunctive — embora, caso, para que, a não ser que, desde que, contanto que
  - topic: The passive with ser and estar, and the impersonal se
  - topic: The personal infinitive in all its uses
  - topic: Reported speech with tense changes
  - topic: Gerund clauses (chegando em casa, liguei…)
  - topic: Recognising formal forms — mesóclise (far-se-á), tu and vós conjugations
  - topic: Word formation — diminutives (-inho, -zinho), augmentatives (-ão), common prefixes
themes:
  - society and politics
  - economy and work
  - science and technology
  - the arts
  - debate and opinion
