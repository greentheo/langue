title: Mastery
summary: >
  Near-native command: you understand virtually everything and can express
  fine shades of meaning. Roughly Celpe-Bras "Avançado Superior", and DUPLE in
  Portugal's CAPLE exams.
can_do:
  - understand virtually everything you hear or read, with ease
  - summarise information and arguments from several sources coherently
  - express yourself spontaneously, very fluently and precisely
  - tell apart fine shades of meaning, irony and implication
grammar:
  - topic: Literary forms — pretérito mais-que-perfeito simples (fizera), enclisis and mesoclisis in formal writing
  - topic: Vós and archaic forms in literary and religious texts
  - topic: Style, rhetoric, irony and wordplay
  - topic: Proverbs, idioms and cultural references (quem não tem cão caça com gato)
  - topic: Specialised registers — legal, academic, journalistic
  - topic: Precise collocation and connotation
themes:
  - literature (Machado de Assis, Clarice Lispector, Guimarães Rosa)
  - specialised fields
  - Brazilian and Lusophone culture
